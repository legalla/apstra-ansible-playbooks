## ---------------------------------------------------------------------------
## logout.yml
## Shared teardown: closes the Apstra session (imported by every orchestrator).
## ---------------------------------------------------------------------------
---
- name: Logout from Apstra
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:

    - name: Logout from Apstra
      juniper.apstra.authenticate:
        logout: true
        auth_token: "{{ auth.token }}"