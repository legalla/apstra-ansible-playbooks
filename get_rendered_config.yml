## ---------------------------------------------------------------------------
## get_rendered_config.yml
## Retrieves the rendered (full) configuration of a device.
## ---------------------------------------------------------------------------
---
- name: Commit Checks
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:

    - name: Set blueprint name fact
      ansible.builtin.set_fact:
        blueprint_name: "{{ blueprint_name | default('DCX') }}"

    - name: Connect to Apstra
      juniper.apstra.authenticate:
        logout: false
      register: auth


    - name: "Test 4: Collect config for a specific device"
      juniper.apstra.blueprint_config:
        id:
          blueprint: "{{ blueprint_name }}"
        devices:
          - spine1
        auth_token: "{{ auth.token }}"
      register: single_config

    - name: Show config for a specific device
      ansible.builtin.debug:
        var: single_config

    - name: Logout of Apstra
      juniper.apstra.authenticate:
        logout: true
        auth_token: "{{ auth.token }}"