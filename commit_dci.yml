## ---------------------------------------------------------------------------
## commit_dci.yml
## Commits the blueprint after the DCI configuration.
## ---------------------------------------------------------------------------
---
- name: Commit DCI
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:

    - name: "Commit"
      juniper.apstra.blueprint:
        auth_token: "{{ auth.token }}"
        id:
          blueprint: "{{ blueprint_name }}"
        lock_state: "ignore"
        commit_description: "DCI Creation"
        state: committed