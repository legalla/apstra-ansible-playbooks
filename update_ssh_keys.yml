## ---------------------------------------------------------------------------
## update_ssh_keys.yml
## Pushes SSH keys to the managed devices.
## ---------------------------------------------------------------------------

---
- name: Update SSH Keys
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:

    - name: Set blueprint name fact
      ansible.builtin.set_fact:
        blueprint_name: "{{ blueprint_name | default('DCX') }}"

    - name: Connect to Apstra
      juniper.apstra.authenticate:
        logout: false
      register: auth

    - name: Clear stored host key by management IP
      juniper.apstra.system_agents:
        id:
          system_name: DCX-Border1
          blueprint: "{{ blueprint_name }}"
        state: host_key_updated

    - name: Logout of Apstra
      juniper.apstra.authenticate:
        logout: true
        auth_token: "{{ auth.token }}"