## ---------------------------------------------------------------------------
## init.yml
## Shared bootstrap: sets the blueprint_name fact and opens the Apstra session (imported by every orchestrator).
## ---------------------------------------------------------------------------
---
- name: Init
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Set blueprint name fact
      ansible.builtin.set_fact:
        blueprint_name: "{{ blueprint_name | default('DCX') }}"

    - name: Connect to Apstra
      juniper.apstra.authenticate:
        logout: false
      register: auth