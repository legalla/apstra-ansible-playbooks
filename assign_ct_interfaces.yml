## ---------------------------------------------------------------------------
## assign_ct_interfaces.yml
## Assigns connectivity templates to specific interfaces / application points.
## ---------------------------------------------------------------------------
---
- name: Assign CT to Interfaces
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:

    - name: Set blueprint name fact
      ansible.builtin.set_fact:
        blueprint_name: "{{ blueprint_name | default('apstra-pod1') }}"

    - name: Connect to Apstra
      juniper.apstra.authenticate:
        logout: false
      register: auth

    - name: "Assign CT to Interfaces for VN NewVN1"
      juniper.apstra.connectivity_template_assignment:
          id:
            blueprint: "{{ blueprint_name }}"
            ct_id: "Untagged VxLAN 'NewVN1'"
          body:
            application_point_ids:
              - "apstra_esi_001_leaf1:ge-0/0/3"
              - "apstra_single_001_leaf1:ge-0/0/2"
          state: present

    - name: "Assign CT to Interfaces in VRF VRF2"
      juniper.apstra.connectivity_template_assignment:
          id:
            blueprint: "{{ blueprint_name }}"
            ct_id: "Tagged VxLAN 'NewVN2'"
          body:
            application_point_ids:
              - "apstra_esi_001_leaf1:ge-0/0/3"
              - "apstra_esi_001_leaf1/apstra_esi_001_leaf2:ae1"
              - "apstra_single_001_leaf1:ge-0/0/2"
          state: present

    - name: Logout of Apstra
      juniper.apstra.authenticate:
        logout: true
        auth_token: "{{ auth.token }}"