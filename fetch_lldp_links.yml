## ---------------------------------------------------------------------------
## fetch_lldp_links.yml
## Fetches LLDP neighbor data to refresh the cabling map.
## ---------------------------------------------------------------------------
---
- name: Fetch LLDP Data
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:

    - name: Update cabling map from LLDP discoveries
      juniper.apstra.cabling_map:
        id:
          blueprint: "{{ blueprint_name }}"
        state: lldp
        body:
          update_cabling_map: true
