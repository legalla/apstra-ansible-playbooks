## ---------------------------------------------------------------------------
## Sensitive connection parameters (ANONYMISED example values).
##
## Copy this file to vars/credentials.yml, then replace every placeholder
## below with the values of YOUR environment. The
## example IP addresses use the RFC 5737 documentation ranges only, and every
## secret is set to "CHANGE_ME" so that no real credential is ever committed to
## Git.
##
## Recommended: keep the real values in an Ansible Vault file and never in
## clear text. Apstra controller credentials themselves are read from the
## environment (APSTRA_URL / APSTRA_USERNAME / APSTRA_PASSWORD) by the
## juniper.apstra.authenticate module and are therefore not stored here.
## ---------------------------------------------------------------------------
---
# vCenter / VMware Virtual Infrastructure Manager (VIM)
vcenter_ip: "198.51.100.10"                 # Management IP of the vCenter server
vcenter_username: "administrator@vsphere.local"
vcenter_password: "CHANGE_ME"                # Store in Ansible Vault, never in clear text

# RADIUS 802.1x server
radius_server_ip: "198.51.100.20"
radius_key: "CHANGE_ME"                      # RADIUS shared secret

# Infrastructure services published through Property Sets
ntp_server_ip: "198.51.100.123"
sflow_collector_ip: "198.51.100.200"
