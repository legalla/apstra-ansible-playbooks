## ---------------------------------------------------------------------------
## create_srx_l3_tenant5.yml
## Creates the layer-3 SRX service (routing policies + IP) for tenant 5.
## ---------------------------------------------------------------------------
---
- name: Create Generic Systems for SRX
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:

    - name: Set blueprint name fact
      ansible.builtin.set_fact:
        blueprint_name: "{{ blueprint_name | default('DCX') }}"

    - name: Connect to Apstra
      juniper.apstra.authenticate:
        logout: false
      register: auth

    - name: Create a generic system representing SRX L3
      juniper.apstra.generic_systems:
        id:
          blueprint: "{{ blueprint_name }}"
        body:
          name: "SRX-L3"
          hostname: "SRX-L3"
          asn: 65900
          port_channel_id_min: 3
          port_channel_id_max: 3
          tags:
            - SRX
          links:
            - target_switch_id: "DCX-leaf1"
              target_switch_if_name: "xe-0/0/3"
              target_switch_if_transform_id: 1
            - target_switch_id: "DCX-leaf2"
              target_switch_if_name: "xe-0/0/3"
              target_switch_if_transform_id: 1
        state: present

    - name: Create a routing policy for SR in VRF Tenant1
      juniper.apstra.routing_policy:
        id:
          blueprint: "{{ blueprint_name }}"
        body:
          description: "BGP-Tenant1"
          expect_default_ipv4_route: true
          expect_default_ipv6_route: false
          export_policy:
            l2edge_subnets: false
            loopbacks: false
            spine_leaf_links: false
            spine_superspine_links: false
            static_routes: false
          extra_export_routes:
            - prefix: "192.0.2.0/24"
              action: "permit"
              le_mask: 32
          import_policy: "all"
          label: "BGP-Tenant1"
          policy_type: "user_defined"
        state: present

    - name: Create a routing policy for SR in VRF Tenant2
      juniper.apstra.routing_policy:
        id:
          blueprint: "{{ blueprint_name }}"
        body:
          description: "BGP-Tenant2"
          expect_default_ipv4_route: true
          expect_default_ipv6_route: false
          export_policy:
            l2edge_subnets: false
            loopbacks: false
            spine_leaf_links: false
            spine_superspine_links: false
            static_routes: false
          extra_export_routes:
            - prefix: "192.0.2.0/24"
              action: "permit"
              le_mask: 32
          import_policy: "all"
          label: "BGP-Tenant2"
          policy_type: "user_defined"
        state: present

    - name: Create a routing policy for SR in VRF Tenant3
      juniper.apstra.routing_policy:
        id:
          blueprint: "{{ blueprint_name }}"
        body:
          description: "BGP-Tenant3"
          expect_default_ipv4_route: true
          expect_default_ipv6_route: false
          export_policy:
            l2edge_subnets: false
            loopbacks: false
            spine_leaf_links: false
            spine_superspine_links: false
            static_routes: false
          extra_export_routes:
            - prefix: "192.0.2.0/24"
              action: "permit"
              le_mask: 32
          import_policy: "all"
          label: "BGP-Tenant3"
          policy_type: "user_defined"
        state: present

    - name: Create BGP-to-SRX Connectivity Template
      juniper.apstra.connectivity_template:
        id:
          blueprint: "{{ blueprint_name }}"
        body:
          name: "BGP-to-SRX"
          type: interface
          description: "CT for BGP-to-SRX connectivity"
          tags:
            - Router
          primitives:
            ip_links:
              srx_link1:
                security_zone: "Tenant1"
                interface_type: tagged
                ipv4_addressing_type: numbered
                ipv6_addressing_type: none
                vlan_id: 901
                bgp_peering_generic_systems:
                  bgp_srx1:
                    bfd: false
                    session_addressing_ipv4: addressed
                    session_addressing_ipv6: none
                    ipv4_safi: true
                    ipv6_safi: false
                    ttl: 2
                    holdtime_timer: 90
                    keepalive_timer: 30
                    peer_from: interface
                    peer_to: interface_or_ip_endpoint
                    neighbor_asn_type: static
                    routing_policies:
                      default_rp:
                        rp_to_attach: "BGP-Tenant1"
              srx_link2:
                security_zone: "Tenant2"
                interface_type: tagged
                ipv4_addressing_type: numbered
                ipv6_addressing_type: none
                vlan_id: 801
                bgp_peering_generic_systems:
                  bgp_srx2:
                    bfd: false
                    session_addressing_ipv4: addressed
                    session_addressing_ipv6: none
                    ipv4_safi: true
                    ipv6_safi: false
                    ttl: 2
                    holdtime_timer: 90
                    keepalive_timer: 30
                    peer_from: interface
                    peer_to: interface_or_ip_endpoint
                    neighbor_asn_type: static
                    routing_policies:
                      default_rp:
                        rp_to_attach: "BGP-Tenant2"
              srx_link3:
                security_zone: "Tenant3"
                interface_type: tagged
                ipv4_addressing_type: numbered
                ipv6_addressing_type: none
                vlan_id: 701
                bgp_peering_generic_systems:
                  bgp_srx3:
                    bfd: false
                    session_addressing_ipv4: addressed
                    session_addressing_ipv6: none
                    ipv4_safi: true
                    ipv6_safi: false
                    ttl: 2
                    holdtime_timer: 90
                    keepalive_timer: 30
                    peer_from: interface
                    peer_to: interface_or_ip_endpoint
                    neighbor_asn_type: static
                    routing_policies:
                      default_rp:
                        rp_to_attach: "BGP-Tenant3"
        state: present

    - name: Assign Connectivity Template BGP-to-SRX for SRX L3
      juniper.apstra.connectivity_template_assignment:
          id:
            blueprint: "{{ blueprint_name }}"
            ct_id: "BGP-to-SRX"
          body:
            application_point_ids:
              - "DCX-Leaf1:xe-0/0/3"
              - "DCX-Leaf2:xe-0/0/3"
          state: present

    - name: Assign IP to interfaces in Tenant1 for BGP to SRX
      juniper.apstra.security_zone:
        id:
          blueprint: "{{ blueprint_name}}"
        body:
          sz_name: "Tenant1"
          interfaces_ip_assignments:
            - interface: "DCX-Leaf1:xe-0/0/3.901"
              endpoint1_ipv4_address: 203.0.113.141/31
              endpoint2_ipv4_address: 203.0.113.140/31
            - interface: "DCX-Leaf2:xe-0/0/3.901"
              endpoint1_ipv4_address: 203.0.113.143/31
              endpoint2_ipv4_address: 203.0.113.142/31

    - name: Assign IP to interfaces in Tenant2 for BGP to SRX
      juniper.apstra.security_zone:
        id:
          blueprint: "{{ blueprint_name}}"
        body:
          sz_name: "Tenant2"
          interfaces_ip_assignments:
            - interface: "DCX-Leaf1:xe-0/0/3.801"
              endpoint1_ipv4_address: 203.0.113.145/31
              endpoint2_ipv4_address: 203.0.113.144/31
            - interface: "DCX-Leaf2:xe-0/0/3.801"
              endpoint1_ipv4_address: 203.0.113.147/31
              endpoint2_ipv4_address: 203.0.113.146/31

    - name: Assign IP to interfaces in Tenant3 for BGP to SRX
      juniper.apstra.security_zone:
        id:
          blueprint: "{{ blueprint_name}}"
        body:
          sz_name: "Tenant3"
          interfaces_ip_assignments:
            - interface: "DCX-Leaf1:xe-0/0/3.701"
              endpoint1_ipv4_address: 203.0.113.149/31
              endpoint2_ipv4_address: 203.0.113.148/31
            - interface: "DCX-Leaf2:xe-0/0/3.701"
              endpoint1_ipv4_address: 203.0.113.151/31
              endpoint2_ipv4_address: 203.0.113.150/31

    - name: Logout of Apstra
      juniper.apstra.authenticate:
        logout: true
        auth_token: "{{ auth.token }}"